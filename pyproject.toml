[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-chromadb-embeddings-plugin"
dynamic = ["version"]
description = "A chromadb embeddings plugin for OVOS"
readme = "README.md"
license = "MIT"
authors = [{name = "jarbasai", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"
keywords = ["OVOS", "openvoiceos", "plugin", "chromadb", "embeddings"]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "numpy",
    "chromadb",
]

[project.optional-dependencies]
test = ["pytest", "numpy", "chromadb"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-chromadb-embeddings-plugin"
Repository = "https://github.com/OpenVoiceOS/ovos-chromadb-embeddings-plugin"

[project.entry-points."opm.embeddings"]
ovos-chromadb-embeddings-plugin = "ovos_chromadb_embeddings:ChromaEmbeddingsDB"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_chromadb_embeddings*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_chromadb_embeddings.version.__version__"}
